<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4CAF50">
    <title>Snek Game</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="src/assets/favicon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="src/assets/icon.png">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
            touch-action: none;
        }
        #game-container {
            margin-top: 20px;
            position: relative;
        }
        #game-board {
            border: 2px solid #000;
            background-color: #ddd;
            position: relative;
        }
        .cell {
            position: absolute;
            border: 0.5px solid #ccc;
            background-color: #fff;
        }
        .snake-body {
            position: absolute;
            background-color: #4CAF50;
            border-radius: 4px;
            z-index: 1;
        }
        .snake-head {
            position: absolute;
            background-color: #388E3C;
            border-radius: 4px;
            z-index: 2;
        }
        .food {
            position: absolute;
            background-color: #F44336;
            border-radius: 10px;
            z-index: 1;
        }
        #score-container {
            margin: 10px 0;
        }
        #score {
            font-size: 24px;
            font-weight: bold;
        }
        #controls {
            margin-top: 30px;
            width: 180px;
            height: 180px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 5px;
        }
        .control-btn {
            background-color: #e0e0e0;
            border-radius: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        .control-btn:active {
            background-color: #bdbdbd;
        }
        .placeholder {
            visibility: hidden;
        }
        #buttons {
            display: flex;
            margin-top: 20px;
        }
        .button {
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin: 0 10px;
        }
        #pause-btn {
            background-color: #4CAF50;
        }
        #reset-btn {
            background-color: #F44336;
        }
        #test-btn {
            background-color: #2196F3;
        }
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            display: none;
        }
        #game-over-text {
            font-size: 40px;
            margin-bottom: 20px;
        }
        #final-score {
            font-size: 28px;
        }
        #install-container {
            margin-top: 20px;
            display: none;
        }
        #install-btn {
            background-color: #2196F3;
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        #test-results {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 80%;
            max-width: 600px;
            background-color: #fff;
            display: none;
            max-height: 300px;
            overflow-y: auto;
        }
        .test-pass {
            color: #4CAF50;
        }
        .test-fail {
            color: #F44336;
        }
    </style>
</head>
<body>
    <h1>Snek Game</h1>
    
    <div id="score-container">
        <span>Score: </span><span id="score">0</span>
    </div>
    
    <div id="game-container">
        <canvas id="game-board" width="300" height="300"></canvas>
        
        <div id="game-over">
            <div id="game-over-text">Game Over!</div>
            <div id="final-score">Final Score: 0</div>
        </div>
    </div>
    
    <div id="controls">
        <div class="placeholder"></div>
        <div class="control-btn" id="up-btn">↑</div>
        <div class="placeholder"></div>
        <div class="control-btn" id="left-btn">←</div>
        <div class="placeholder"></div>
        <div class="control-btn" id="right-btn">→</div>
        <div class="placeholder"></div>
        <div class="control-btn" id="down-btn">↓</div>
        <div class="placeholder"></div>
    </div>
    
    <div id="buttons">
        <button id="pause-btn" class="button">Pause</button>
        <button id="reset-btn" class="button">Reset</button>
        <button id="test-btn" class="button">Run Tests</button>
    </div>
    
    <div id="install-container">
        <button id="install-btn">Install App</button>
    </div>
    
    <div id="test-results"></div>
    
    <script>
        // Game constants
        const GRID_SIZE = 15;
        const CELL_SIZE = 20;
        const GAME_SPEED = 150; // milliseconds

        // Game state
        let snake = [{ x: Math.floor(GRID_SIZE / 2), y: Math.floor(GRID_SIZE / 2) }];
        let food = { x: 5, y: 5 };
        let direction = 'RIGHT';
        let isGameOver = false;
        let score = 0;
        let isPaused = false;
        let gameLoop;

        // DOM elements
        const gameBoard = document.getElementById('game-board');
        const ctx = gameBoard.getContext('2d');
        const scoreElement = document.getElementById('score');
        const pauseButton = document.getElementById('pause-btn');
        const resetButton = document.getElementById('reset-btn');
        const testButton = document.getElementById('test-btn');
        const gameOverElement = document.getElementById('game-over');
        const finalScoreElement = document.getElementById('final-score');
        const installContainer = document.getElementById('install-container');
        const installButton = document.getElementById('install-btn');
        const testResults = document.getElementById('test-results');

        // Set up the game board size
        gameBoard.width = GRID_SIZE * CELL_SIZE;
        gameBoard.height = GRID_SIZE * CELL_SIZE;

        // Initialize the game
        function init() {
            // Set up control buttons
            document.getElementById('up-btn').addEventListener('click', () => changeDirection('UP'));
            document.getElementById('down-btn').addEventListener('click', () => changeDirection('DOWN'));
            document.getElementById('left-btn').addEventListener('click', () => changeDirection('LEFT'));
            document.getElementById('right-btn').addEventListener('click', () => changeDirection('RIGHT'));

            // Set up keyboard controls
            document.addEventListener('keydown', handleKeyPress);

            // Set up game buttons
            pauseButton.addEventListener('click', togglePause);
            resetButton.addEventListener('click', resetGame);
            testButton.addEventListener('click', runTests);
            
            // Add touch swipe controls
            let touchStartX = 0;
            let touchStartY = 0;
            
            gameBoard.addEventListener('touchstart', function(e) {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }, false);
            
            gameBoard.addEventListener('touchend', function(e) {
                const touchEndX = e.changedTouches[0].screenX;
                const touchEndY = e.changedTouches[0].screenY;
                
                const dx = touchEndX - touchStartX;
                const dy = touchEndY - touchStartY;
                
                if (Math.abs(dx) > Math.abs(dy)) {
                    if (dx > 0) {
                        changeDirection('RIGHT');
                    } else {
                        changeDirection('LEFT');
                    }
                } else {
                    if (dy > 0) {
                        changeDirection('DOWN');
                    } else {
                        changeDirection('UP');
                    }
                }
            }, false);

            // Start the game loop
            startGameLoop();
        }

        // Game loop
        function startGameLoop() {
            gameLoop = setInterval(() => {
                if (!isPaused && !isGameOver) {
                    moveSnake();
                    drawGame();
                }
            }, GAME_SPEED);
        }

        // Draw the game
        function drawGame() {
            // Clear the canvas
            ctx.clearRect(0, 0, gameBoard.width, gameBoard.height);

            // Draw grid
            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    ctx.fillStyle = '#fff';
                    ctx.strokeStyle = '#ccc';
                    ctx.fillRect(col * CELL_SIZE, row * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                    ctx.strokeRect(col * CELL_SIZE, row * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                }
            }

            // Draw food
            ctx.fillStyle = '#F44336';
            ctx.beginPath();
            ctx.arc(
                food.x * CELL_SIZE + CELL_SIZE / 2,
                food.y * CELL_SIZE + CELL_SIZE / 2,
                CELL_SIZE / 2 - 2,
                0,
                2 * Math.PI
            );
            ctx.fill();

            // Draw snake
            snake.forEach((segment, index) => {
                ctx.fillStyle = index === 0 ? '#388E3C' : '#4CAF50';
                ctx.fillRect(
                    segment.x * CELL_SIZE + 1,
                    segment.y * CELL_SIZE + 1,
                    CELL_SIZE - 2,
                    CELL_SIZE - 2
                );
            });
        }

        // Move the snake
        function moveSnake() {
            // Create a copy of the head
            const head = { ...snake[0] };

            // Move the head based on direction
            switch (direction) {
                case 'UP':
                    head.y -= 1;
                    break;
                case 'RIGHT':
                    head.x += 1;
                    break;
                case 'DOWN':
                    head.y += 1;
                    break;
                case 'LEFT':
                    head.x -= 1;
                    break;
            }

            // Check for collisions (walls or self)
            if (
                head.x < 0 ||
                head.x >= GRID_SIZE ||
                head.y < 0 ||
                head.y >= GRID_SIZE ||
                snake.some(segment => segment.x === head.x && segment.y === head.y)
            ) {
                gameOver();
                return;
            }

            // Add the new head to the snake
            snake.unshift(head);

            // Check if snake ate food
            if (head.x === food.x && head.y === food.y) {
                // Increase score
                score++;
                scoreElement.textContent = score;

                // Generate new food
                generateFood();
            } else {
                // Remove the tail if no food was eaten
                snake.pop();
            }
        }

        // Generate random food position
        function generateFood() {
            let newFood;
            let isOnSnake;

            do {
                newFood = {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE)
                };

                isOnSnake = snake.some(
                    segment => segment.x === newFood.x && segment.y === newFood.y
                );
            } while (isOnSnake);

            food = newFood;
        }

        // Change direction
        function changeDirection(newDirection) {
            // Prevent 180-degree turns
            if (
                (direction === 'UP' && newDirection === 'DOWN') ||
                (direction === 'DOWN' && newDirection === 'UP') ||
                (direction === 'LEFT' && newDirection === 'RIGHT') ||
                (direction === 'RIGHT' && newDirection === 'LEFT')
            ) {
                return;
            }

            direction = newDirection;
        }

        // Handle keyboard input
        function handleKeyPress(event) {
            switch (event.key) {
                case 'ArrowUp':
                    changeDirection('UP');
                    break;
                case 'ArrowRight':
                    changeDirection('RIGHT');
                    break;
                case 'ArrowDown':
                    changeDirection('DOWN');
                    break;
                case 'ArrowLeft':
                    changeDirection('LEFT');
                    break;
                case ' ':
                    togglePause();
                    break;
                case 'r':
                case 'R':
                    resetGame();
                    break;
                case 't':
                case 'T':
                    runTests();
                    break;
            }
        }

        // Toggle pause
        function togglePause() {
            isPaused = !isPaused;
            pauseButton.textContent = isPaused ? 'Resume' : 'Pause';
        }

        // Reset game
        function resetGame() {
            snake = [{ x: Math.floor(GRID_SIZE / 2), y: Math.floor(GRID_SIZE / 2) }];
            direction = 'RIGHT';
            score = 0;
            scoreElement.textContent = score;
            isGameOver = false;
            isPaused = false;
            pauseButton.textContent = 'Pause';
            resetButton.textContent = 'Reset';
            gameOverElement.style.display = 'none';
            testResults.style.display = 'none';
            generateFood();
        }

        // Game over
        function gameOver() {
            isGameOver = true;
            finalScoreElement.textContent = `Final Score: ${score}`;
            gameOverElement.style.display = 'flex';
            resetButton.textContent = 'Play Again';
        }

        // Run tests
        function runTests() {
            // Pause the game while testing
            const wasPaused = isPaused;
            isPaused = true;
            
            // Show test results panel
            testResults.style.display = 'block';
            testResults.innerHTML = '<h3>Test Results</h3>';
            
            // Save game state
            const originalSnake = [...snake];
            const originalFood = { ...food };
            const originalDirection = direction;
            const originalScore = score;
            const originalGameOver = isGameOver;
            
            // Run tests
            testGameInitialization();
            testSnakeMovement();
            testFoodGeneration();
            testCollisionDetection();
            testScoreCalculation();
            
            // Restore game state
            snake = originalSnake;
            food = originalFood;
            direction = originalDirection;
            score = originalScore;
            isGameOver = originalGameOver;
            
            // Resume game if it wasn't paused before
            isPaused = wasPaused;
            
            // Add a message to the test results
            testResults.innerHTML += '<p>All tests completed!</p>';
        }
        
        // Test functions
        function testGameInitialization() {
            // Create a snapshot of the current game to test
            const testSnake = [{ x: Math.floor(GRID_SIZE / 2), y: Math.floor(GRID_SIZE / 2) }];
            
            // Test snake initialization
            addTestResult(
                'Snake initialization',
                testSnake.length === 1 && 
                testSnake[0].x === Math.floor(GRID_SIZE / 2) && 
                testSnake[0].y === Math.floor(GRID_SIZE / 2)
            );
            
            // Test initial direction
            addTestResult('Initial direction', 'RIGHT' === 'RIGHT');
            
            // Test initial score
            addTestResult('Initial score', 0 === 0);
            
            // Test initial game state
            addTestResult('Initial game state', false === false);
        }
        
        function testSnakeMovement() {
            // Create a test snake
            const testSnake = [{ x: 5, y: 5 }];
            const testDirection = 'RIGHT';
            
            // Move right
            let head = { ...testSnake[0] };
            if (testDirection === 'RIGHT') head.x += 1;
            
            addTestResult('Snake moves right', head.x === 6 && head.y === 5);
            
            // Test direction change
            const newDirection = 'DOWN';
            const canChange = !(
                (testDirection === 'UP' && newDirection === 'DOWN') ||
                (testDirection === 'DOWN' && newDirection === 'UP') ||
                (testDirection === 'LEFT' && newDirection === 'RIGHT') ||
                (testDirection === 'RIGHT' && newDirection === 'LEFT')
            );
            
            addTestResult('Can change direction', canChange);
            
            // Test invalid direction change
            const invalidDirection = 'LEFT';
            const shouldBlock = (
                (testDirection === 'UP' && invalidDirection === 'DOWN') ||
                (testDirection === 'DOWN' && invalidDirection === 'UP') ||
                (testDirection === 'LEFT' && invalidDirection === 'RIGHT') ||
                (testDirection === 'RIGHT' && invalidDirection === 'LEFT')
            );
            
            addTestResult('Blocks 180-degree turns', shouldBlock);
        }
        
        function testFoodGeneration() {
            // Generate a test food position
            const testSnake = [{ x: 5, y: 5 }];
            let testFood;
            let isOnSnake;
            
            do {
                testFood = {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE)
                };
                
                isOnSnake = testSnake.some(
                    segment => segment.x === testFood.x && segment.y === testFood.y
                );
            } while (isOnSnake);
            
            // Check if food is within grid
            const isWithinGrid = 
                testFood.x >= 0 && 
                testFood.x < GRID_SIZE && 
                testFood.y >= 0 && 
                testFood.y < GRID_SIZE;
            
            addTestResult('Food is within grid', isWithinGrid);
            
            // Check if food is not on snake
            addTestResult('Food is not on snake', !isOnSnake);
        }
        
        function testCollisionDetection() {
            // Test wall collisions
            const leftWall = { x: -1, y: 5 };
            const rightWall = { x: GRID_SIZE, y: 5 };
            const topWall = { x: 5, y: -1 };
            const bottomWall = { x: 5, y: GRID_SIZE };
            
            const hitsLeftWall = leftWall.x < 0;
            const hitsRightWall = rightWall.x >= GRID_SIZE;
            const hitsTopWall = topWall.y < 0;
            const hitsBottomWall = bottomWall.y >= GRID_SIZE;
            
            addTestResult('Detects left wall collision', hitsLeftWall);
            addTestResult('Detects right wall collision', hitsRightWall);
            addTestResult('Detects top wall collision', hitsTopWall);
            addTestResult('Detects bottom wall collision', hitsBottomWall);
            
            // Test self collision
            const testSnake = [
                { x: 5, y: 5 },  // head
                { x: 6, y: 5 },
                { x: 6, y: 6 },
                { x: 5, y: 6 },
                { x: 5, y: 5 }   // tail overlaps with head
            ];
            
            const hitsSelf = testSnake.slice(1).some(
                segment => segment.x === testSnake[0].x && segment.y === testSnake[0].y
            );
            
            addTestResult('Detects self collision', hitsSelf);
        }
        
        function testScoreCalculation() {
            // Test eating food increases score
            let testScore = 0;
            const testSnake = [{ x: 5, y: 5 }];
            const testFood = { x: 6, y: 5 };
            
            // Simulate snake eating food
            if (testSnake[0].x + 1 === testFood.x && testSnake[0].y === testFood.y) {
                testScore++;
            }
            
            addTestResult('Score increases when eating food', testScore === 1);
            
            // Test snake grows when eating food
            const newHead = { x: testFood.x, y: testFood.y };
            const newSnake = [newHead, ...testSnake];
            
            addTestResult('Snake grows after eating food', newSnake.length === testSnake.length + 1);
        }
        
        function addTestResult(testName, passed) {
            const resultClass = passed ? 'test-pass' : 'test-fail';
            const resultText = passed ? 'PASSED' : 'FAILED';
            testResults.innerHTML += `<p class="${resultClass}">${testName}: ${resultText}</p>`;
        }

        // PWA Installation
        let deferredPrompt;

        window.addEventListener('beforeinstallprompt', (e) => {
            // Prevent Chrome 67 and earlier from automatically showing the prompt
            e.preventDefault();
            // Stash the event so it can be triggered later
            deferredPrompt = e;
            // Show the install button
            installContainer.style.display = 'block';
        });

        installButton.addEventListener('click', () => {
            // Hide the install button
            installContainer.style.display = 'none';
            // Show the prompt
            deferredPrompt.prompt();
            // Wait for the user to respond to the prompt
            deferredPrompt.userChoice.then((choiceResult) => {
                if (choiceResult.outcome === 'accepted') {
                    console.log('User accepted the install prompt');
                } else {
                    console.log('User dismissed the install prompt');
                }
                deferredPrompt = null;
            });
        });

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(registration => {
                        console.log('Service Worker registered with scope:', registration.scope);
                    })
                    .catch(error => {
                        console.log('Service Worker registration failed:', error);
                    });
            });
        }

        // Initialize the game
        init();
        drawGame();
    </script>
    
    <script src="test.js"></script>
</body>
</html>
